<!-- This page is a generic template: it reads ?id=<project-id> from the
     URL, loads data/projects.json, and renders the matching project's
     case study using the exact same layout as project1/2/3.html.
     New projects created in admin.html without a dedicated static page
     link here automatically. -->
<section class="project-page" id="projectPage">
    <p>Loading project…</p>
</section>

<!-- ================= FOOTER ================= -->
<footer>
    <h3>Hussein Mohamed</h3>
    <p>Data Analyst | Excel | Power BI</p>
    <p class="copyright">© 2026 Hussein Mohamed. All Rights Reserved.</p>
</footer>

<a href="#" id="backToTop" aria-label="Back to top">↑</a>

<audio id="bgMusic" loop preload="none">
    <source src="assets/music/music.mp3" type="audio/mpeg">
</audio>
<button id="musicBtn" aria-label="Toggle background music">🎵</button>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<script src="assets/js/config.js"></script>
<script src="assets/js/particles-config.js"></script>
<script src="assets/js/script.js"></script>
<script src="assets/js/music.js"></script>
<script src="assets/js/project-templates.js"></script>

<script src="assets/js/analytics.js"></script>
<script src="assets/js/consent.js"></script>
<script src="assets/js/exit-feedback.js"></script>

<script>
(function () {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const page = document.getElementById("projectPage");
    const T = window.HM_ProjectTemplates;

    if (!id || !T) {
        page.innerHTML = "<p>Project not found. <a href=\"index.html#portfolio\" class=\"btn\">⬅ Back to Portfolio</a></p>";
        return;
    }

    fetch("data/projects.json")
        .then((res) => res.json())
        .then((projects) => {
            const project = projects.find((p) => p.id === id && T.isPublic(p));
            if (!project) {
                page.innerHTML = "<p>Project not found. <a href=\"index.html#portfolio\" class=\"btn\">⬅ Back to Portfolio</a></p>";
                return;
            }

            document.title = project.name + " — Case Study | HM Portfolio";
            document.getElementById("pageTitle").textContent = document.title;
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) metaDesc.setAttribute("content", (project.description || project.name) + " — by Hussein Mohamed.");

            page.innerHTML = T.renderCaseStudy(project);

            // The video (if any) was just added to the DOM after analytics.js
            // already ran its one-time video scan — re-run it so this video
            // gets start/progress/complete tracking too.
            if (window.HM_trackVideos) window.HM_trackVideos();
        })
        .catch(() => {
            page.innerHTML = "<p>Project could not be loaded. <a href=\"index.html#portfolio\" class=\"btn\">⬅ Back to Portfolio</a></p>";
        });
})();
</script>

</body>
</html>
